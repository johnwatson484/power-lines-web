name: Forecast validation
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:11.4-alpine
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: power_lines_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test PowerLinesWeb.Tests/PowerLinesWeb.Tests.csproj --configuration Release
        env:
          POWERLINES_TEST_DB: Host=localhost;Port=5432;Database=power_lines_test;Username=postgres;Password=integration
